<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting...</title>
  <script>
    // SPA redirect for GitHub Pages
    var path = window.location.pathname;
    var base = '/dogeub';
    if (!path.startsWith(base)) base = '';
    var redirect = base + '/?redirect=' + encodeURIComponent(path);
    window.location.replace(redirect);
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
